name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch breakage from new Home Assistant or HACS rules without a commit.
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The repository has no brand assets, description, topics or license yet.
          ignore: brands description topics license
